<html>
<head>
    <title>List Files</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="author" content="Immanuel (Dev)">
    <link rel="shortcut icon" type="image/png" href="https://immanuel.co/favicon.ico">
</head>
<body>

    <ol>
        <!-- For loop logic of jinja template -->
        {%for f in files%}

        <li><a href="{{ url_for('dir_listing', req_path=f.path) }}">{{f.name}}</a>{% if f.size is not none %} ({{f.size}} bytes){% endif %}</li>
        {%endfor%}

    </ol>

</body>
</html>
